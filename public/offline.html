<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Offline - DuitBot Tracker</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f0fdfa,#fff);color:#0f172a;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,440px);padding:36px;border:1px solid #ccfbf1;border-radius:28px;background:#fff;text-align:center;box-shadow:0 24px 70px rgba(15,118,110,.12)}.icon{width:72px;height:72px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;background:#0f766e;color:#fff;font-size:38px;font-weight:800}h1{margin:0;font-size:26px}p{margin:12px 0 24px;color:#475569;line-height:1.6}button{border:0;border-radius:12px;padding:13px 22px;background:#0f766e;color:#fff;font:inherit;font-weight:700;cursor:pointer}small{display:block;margin-top:22px;color:#64748b}
    </style>
</head>
<body>
    <main class="card">
        <img class="icon" src="/brand/duitbot-logo.png" alt="DuitBot Tracker">
        <h1>Kamu sedang offline</h1>
        <p>DuitBot belum dapat mengambil data terbaru. Periksa koneksi internet lalu coba kembali.</p>
        <button onclick="location.reload()">Coba lagi</button>
        <small>Transaksi melalui Telegram akan muncul setelah koneksi kembali.</small>
    </main>
</body>
</html>
