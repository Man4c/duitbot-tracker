# Render Blueprint — DuitBot Tracker (FREE TIER)
# Deploy: hubungkan repo di Render → "New Blueprint" → pilih repo ini.
# Auto-deploy dari branch `main`.
#
# Arsitektur free-tier: SATU web service + PostgreSQL gratis (tanpa worker/cron
# berbayar). Konsekuensi:
#   - QUEUE_CONNECTION=sync  → job jalan langsung dalam request (tanpa worker).
#   - Migrasi dijalankan saat container start (lihat docker/entrypoint.sh), bukan
#     preDeployCommand (fitur berbayar).
#   - Scheduler dipicu endpoint POST /cron/run oleh cron eksternal gratis
#     (mis. cron-job.org) — diamankan CRON_SECRET.
#   - Web service free SPIN-DOWN saat idle; PostgreSQL free bisa kedaluwarsa
#     (cek kebijakan terkini di dashboard Render).

databases:
  - name: duitbot-db
    plan: free
    databaseName: duitbot
    user: duitbot

envVarGroups:
  - name: duitbot-env
    envVars:
      - key: APP_NAME
        value: "DuitBot Tracker"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Free-tier: tanpa worker → job diproses langsung (sync) dalam request.
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: TELEGRAM_BOT_USERNAME
        value: duitbot_tracker_bot
      # --- Secret: isi manual di dashboard ---
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Secret untuk endpoint /cron/run (dipakai cron eksternal gratis).
      - key: CRON_SECRET
        sync: false

services:
  # ---------- WEB (satu-satunya proses) ----------
  - type: web
    name: duitbot-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    dockerCommand: entrypoint web
    envVars:
      - fromGroup: duitbot-env
      - key: DB_HOST
        fromDatabase:
          name: duitbot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: duitbot-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: duitbot-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: duitbot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: duitbot-db
          property: password
