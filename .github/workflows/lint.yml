name: linter

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          composer run-script post-autoload-dump
          php artisan key:generate

      # File Wayfinder (resources/js/actions|routes|wayfinder) di-.gitignore. eslint
      # import/order perlu me-resolve import ke file itu; tanpa di-generate, urutan
      # import salah-klasifikasi → lint gagal. Generate agar kondisi = lokal.
      - name: Generate Wayfinder
        run: php artisan wayfinder:generate --with-form

      - name: Check Pint
        run: composer lint:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check
